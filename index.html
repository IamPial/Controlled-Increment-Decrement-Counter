<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controlled Increment-Decrement Counter App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="counter-app">
            <h3 class="counter-title">Fill The Form Below</h3>
            <p class="lead">Negative Values Are Not Acceptable</p>
            <div class="result">
                <div class="result-body" id="result-body">
                   00
                </div>
                <div class="input-action">
                    <input type="number" min="1" class="input-field" id="increment-input" name="increment">
                    <button class="input-action-btn" id="increment-btn">Increment</button>
                    <button class="input-action-btn" id="decrement-btn">Decrement</button>
                    <input type="number" min="1" class="input-field" id="decrement-input" name="decrement">
                    </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
